name: Test, build and publish

on:
  pull_request:
  push:
    branches: [main]
    # A release is a deliberate act: pushing a v* tag (or running the workflow
    # by hand) publishes. Ordinary pushes to main only verify.
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: publish-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify game and room service
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: chickensoft-games/setup-godot@v2.4.1
        with:
          version: 4.7.1
          use-dotnet: false
          include-templates: false
      - name: Import project resources
        run: godot --headless --path . --import
      - name: Install software rendering support
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri
      - name: Run game tests
        shell: bash
        run: |
          shopt -s nullglob
          status=0
          ran=0
          # tests/ holds only suites. Screenshot captures live in
          # tools/captures and long simulations in tools/sims.
          for test in tests/*.gd; do
            ran=$((ran + 1))
            echo "::group::$test"
            set +e
            # A GDScript runtime error kills the suite coroutine before quit(),
            # which leaves Godot running forever; cap each suite instead.
            if [ "$test" = "tests/FighterFashionPolygonTest.gd" ]; then
              output=$(timeout 300 xvfb-run -a godot --rendering-method gl_compatibility --audio-driver Dummy --disable-vsync --path . --script "$test" 2>&1)
            else
              output=$(timeout 300 godot --headless --path . --script "$test" 2>&1)
            fi
            code=$?
            set -e
            printf '%s\n' "$output"
            echo "::endgroup::"
            if [ "$code" -ne 0 ]; then
              echo "::error::$test exited with status $code"
              status=1
              continue
            fi
            # Exit codes alone hide engine-level faults: a suite can assert its
            # way to a clean 0 while Godot logs rendering or script errors.
            if printf '%s\n' "$output" | grep -q 'ERROR:'; then
              echo "::error::$test exited 0 but Godot logged errors:"
              printf '%s\n' "$output" | grep -n 'ERROR:'
              status=1
            fi
          done
          if [ "$ran" -eq 0 ]; then
            echo "::error::No game test suites found under tests/"
            exit 1
          fi
          echo "Ran $ran game test suite(s)."
          exit "$status"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Verify room service
        working-directory: backend
        run: |
          npm ci
          npm test
          npm run typecheck

  publish:
    name: Build and publish ${{ matrix.name }}
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: HTML5
            preset: Web
            output: build/itch/web/index.html
            directory: build/itch/web
            channel: html5
          - name: Windows
            preset: Windows
            output: build/itch/windows/ZAWARUDO.exe
            directory: build/itch/windows
            channel: windows
    steps:
      - uses: actions/checkout@v7
      - uses: chickensoft-games/setup-godot@v2.4.1
        with:
          version: 4.7.1
          use-dotnet: false
          include-templates: true
      - name: Export release build
        shell: bash
        run: |
          mkdir -p "${{ matrix.directory }}"
          godot --headless --path . --import
          godot --headless --path . --export-release "${{ matrix.preset }}" "${{ matrix.output }}"
          if [ "${{ matrix.channel }}" = "windows" ]; then
            cp itch/WINDOWS-README.txt "${{ matrix.directory }}/README.txt"
          fi
      - uses: remarkablegames/setup-butler@v3
      - name: Publish to itch.io
        run: >-
          butler push "${{ matrix.directory }}"
          "patochaos/zawarudo:${{ matrix.channel }}"
          --userversion "${{ github.ref_type == 'tag' && github.ref_name || github.sha }}"
          --if-changed
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
